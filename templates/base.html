<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}نظام صيانة السيارات{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        :root {
            --sidebar-width: 220px;
            --header-height: 110px;
            --bg-main: #f0f4f8;
            --bg-sidebar: #1a2332;
            --bg-header: #1a2332;
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --accent-hover: #2563eb;
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --sidebar-active: #3b82f6;
            --sidebar-hover: rgba(59,130,246,0.13);
            --shadow: 0 2px 16px rgba(26,35,50,0.10);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            background: var(--bg-main);
            color: #1e293b;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        body.dark-mode {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-color: #e2e8f0;
            color: #e2e8f0;
        }

        /* ===== HEADER ===== */
        .app-header {
            position: fixed;
            top: 0;
            right: var(--sidebar-width);
            left: 0;
            height: var(--header-height);
            background: var(--bg-header);
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 32px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
            gap: 20px;
        }

        .header-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent), #1d4ed8);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(59,130,246,0.35);
        }

        .header-logo i {
            font-size: 28px;
            color: #fff;
        }

        .header-text h1 {
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            margin: 0;
            line-height: 1.2;
            letter-spacing: 0.3px;
        }

        .header-text p {
            font-size: 13px;
            color: var(--text-muted);
            margin: 4px 0 0 0;
        }

        .header-actions {
            margin-right: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-theme-toggle {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 13px;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-theme-toggle:hover {
            background: rgba(255,255,255,0.14);
        }

        .header-date {
            color: var(--text-muted);
            font-size: 13px;
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 6px 14px;
            border: 1px solid rgba(255,255,255,0.10);
        }

        /* ===== SIDEBAR ===== */
        .app-sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--bg-sidebar);
            z-index: 200;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 24px rgba(0,0,0,0.20);
            overflow-y: auto;
        }

        .sidebar-brand {
            padding: 22px 20px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .sidebar-brand-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--accent), #1d4ed8);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(59,130,246,0.35);
        }

        .sidebar-brand-icon i { font-size: 24px; color: #fff; }

        .sidebar-brand-text {
            text-align: center;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.3;
        }

        .sidebar-brand-text span {
            display: block;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 400;
            margin-top: 2px;
        }

        .sidebar-nav {
            padding: 16px 12px;
            flex: 1;
        }

        .sidebar-section-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            padding: 8px 10px 6px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.18s;
            margin-bottom: 3px;
            position: relative;
        }

        .sidebar-link i {
            width: 20px;
            text-align: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .sidebar-link:hover {
            background: var(--sidebar-hover);
            color: var(--accent-light);
        }

        .sidebar-link.active {
            background: linear-gradient(135deg, rgba(59,130,246,0.22), rgba(29,78,216,0.18));
            color: #fff;
            box-shadow: 0 2px 10px rgba(59,130,246,0.18);
        }

        .sidebar-link.active::before {
            content: '';
            position: absolute;
            right: 0;
            top: 25%;
            height: 50%;
            width: 3px;
            background: var(--accent);
            border-radius: 2px 0 0 2px;
        }

        .sidebar-link.active i { color: var(--accent-light); }

        .sidebar-footer {
            padding: 14px 12px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        /* ===== MAIN CONTENT ===== */
        .app-content {
            margin-right: var(--sidebar-width);
            margin-top: var(--header-height);
            padding: 28px 30px;
            min-height: calc(100vh - var(--header-height));
        }

        /* ===== CARDS ===== */
        .card {
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: var(--shadow);
            background: var(--card-bg);
        }

        .card-header {
            border-radius: 14px 14px 0 0 !important;
            padding: 16px 22px;
            font-weight: 700;
        }

        .card-header h3 {
            font-size: 16px;
            margin: 0;
            font-weight: 700;
        }

        /* ===== TABLES ===== */
        .table {
            font-size: 14px;
        }

        .table th {
            font-weight: 700;
            font-size: 13px;
            color: #475569;
            background: #f8fafc;
        }

        /* ===== BUTTONS ===== */
        .btn {
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 600;
            border-radius: 9px;
        }

        /* ===== FORMS ===== */
        .form-control, .form-select {
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            border-radius: 9px;
            border-color: var(--border-color);
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 5px;
        }

        fieldset.border {
            border-color: var(--border-color) !important;
            border-radius: 12px !important;
            background: #fafbfc;
        }

        body.dark-mode fieldset.border { background: rgba(255,255,255,0.03); }

        legend.h5 {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
        }

        /* ===== KANBAN (index page) ===== */
        .kanban-board {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .kanban-col {
            flex: 1;
            min-width: 200px;
            background: #f1f5f9;
            border-radius: 14px;
            padding: 14px 12px;
            border: 1px solid #e2e8f0;
        }

        body.dark-mode .kanban-col { background: #1e293b; border-color: #334155; }

        .kanban-col-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--col-color, #e2e8f0);
        }

        .kanban-col-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--col-color, #e2e8f0);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 15px;
        }

        .kanban-col-title {
            font-size: 14px;
            font-weight: 700;
            color: #334155;
        }

        body.dark-mode .kanban-col-title { color: #e2e8f0; }

        .kanban-badge {
            margin-right: auto;
            background: var(--col-color, #94a3b8);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            border-radius: 20px;
            padding: 2px 12px;
            min-width: 30px;
            text-align: center;
        }

        .kanban-count {
            font-size: 42px;
            font-weight: 900;
            color: var(--col-color, #64748b);
            text-align: center;
            line-height: 1;
            padding: 14px 0 10px;
        }

        .kanban-label {
            font-size: 12px;
            color: var(--text-muted, #94a3b8);
            text-align: center;
        }

        /* ===== DARK MODE overrides ===== */
        body.dark-mode .card { background: #1e293b; border-color: #334155; color: #e2e8f0; }
        body.dark-mode .table th { background: #1e293b; color: #94a3b8; }
        body.dark-mode .form-control, body.dark-mode .form-select {
            background: #0f172a; border-color: #334155; color: #e2e8f0;
        }
        body.dark-mode .app-content { color: #e2e8f0; }
        body.dark-mode .kanban-col-title { color: #cbd5e1; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            :root { --sidebar-width: 0px; --header-height: 80px; }
            .app-header { right: 0; }
            .app-sidebar { transform: translateX(100%); transition: transform 0.3s; }
            .app-sidebar.open { transform: translateX(0); }
        }
    </style>
</head>
<body class="{% if request.COOKIES.theme == 'dark' %}dark-mode{% endif %}">

    <!-- ===== SIDEBAR ===== -->
    <aside class="app-sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-brand-icon">
                <i class="fas fa-car-mechanic" style="color:#fff; font-size:22px;"></i>
                <i class="fas fa-tools" style="display:none"></i>
            </div>
            <div class="sidebar-brand-text">
                مركز الصيانة
                <span>نظام الإدارة المتكامل</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="sidebar-section-label">القائمة الرئيسية</div>

            <a href="{% url 'index' %}" class="sidebar-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}">
                <i class="fas fa-tachometer-alt"></i>
                <span>الرئيسية</span>
            </a>
            <a href="{% url 'customer_list' %}" class="sidebar-link {% if 'customer' in request.resolver_match.url_name %}active{% endif %}">
                <i class="fas fa-users"></i>
                <span>العملاء</span>
            </a>
            <a href="{% url 'car_list' %}" class="sidebar-link {% if 'car' in request.resolver_match.url_name %}active{% endif %}">
                <i class="fas fa-car"></i>
                <span>السيارات</span>
            </a>
            <a href="{% url 'workorder_list' %}" class="sidebar-link {% if 'workorder' in request.resolver_match.url_name %}active{% endif %}">
                <i class="fas fa-clipboard-list"></i>
                <span>أوامر الشغل</span>
            </a>

            <div class="sidebar-section-label" style="margin-top:14px;">المخزن والمالية</div>

            <a href="{% url 'inventory_list' %}" class="sidebar-link {% if 'inventory' in request.resolver_match.url_name %}active{% endif %}">
                <i class="fas fa-boxes"></i>
                <span>المخزن</span>
            </a>
            <a href="{% url 'expense_list' %}" class="sidebar-link {% if 'expense' in request.resolver_match.url_name %}active{% endif %}">
                <i class="fas fa-chart-line"></i>
                <span>الحسابات</span>
            </a>

            <div class="sidebar-section-label" style="margin-top:14px;">الموارد البشرية</div>

            <a href="{% url 'technician_list' %}" class="sidebar-link {% if 'technician' in request.resolver_match.url_name %}active{% endif %}">
                <i class="fas fa-wrench"></i>
                <span>الفنيين</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <button id="theme-toggle" class="btn-theme-toggle w-100" style="width:100%; justify-content:center;">
                <i class="fas fa-moon" id="icon-moon"></i>
                <i class="fas fa-sun" id="icon-sun" style="display:none"></i>
                <span id="theme-label">الوضع الليلي</span>
            </button>
        </div>
    </aside>

    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <div class="header-logo">
            <i class="fas fa-tools"></i>
        </div>
        <div class="header-text">
            <h1>مركز الصيانة المتكامل للسيارات</h1>
            <p>خدمة عملاء متميزة &bull; ضمان على قطع الغيار &bull; صيانة احترافية</p>
        </div>
        <div class="header-actions">
            <div class="header-date" id="header-date"></div>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="app-content">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
    <script>
        // Live date
        function updateDate() {
            const d = new Date();
            const opts = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
            document.getElementById('header-date').textContent = d.toLocaleDateString('ar-EG', opts);
        }
        updateDate();

        // Theme toggle
        const themeBtn = document.getElementById('theme-toggle');
        const iconMoon = document.getElementById('icon-moon');
        const iconSun  = document.getElementById('icon-sun');
        const themeLabel = document.getElementById('theme-label');

        function applyTheme(dark) {
            document.body.classList.toggle('dark-mode', dark);
            iconMoon.style.display = dark ? 'none' : '';
            iconSun.style.display  = dark ? '' : 'none';
            themeLabel.textContent  = dark ? 'الوضع النهاري' : 'الوضع الليلي';
            document.cookie = `theme=${dark ? 'dark' : 'light'}; path=/; max-age=31536000`;
        }

        applyTheme(document.body.classList.contains('dark-mode'));

        themeBtn.addEventListener('click', () => {
            applyTheme(!document.body.classList.contains('dark-mode'));
        });
    </script>
</body>
</html>
